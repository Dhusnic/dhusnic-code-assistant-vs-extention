name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Unit tests (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # Most users are on Windows (PowerShell, OCR, path handling); Linux covers the remote/SSH side.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npx tsc -p .
          node --test "out/test/*.test.js" 2>&1 | tee unit-results.txt
      - name: Slow tests (serial)
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 "out/test/slow/*.test.js" 2>&1 | tee slow-results.txt
      # Job logs need admin rights; annotations are visible to everyone (PR checks page and the API).
      - name: Report failing tests as annotations
        if: failure()
        shell: bash
        run: |
          for f in unit-results.txt slow-results.txt; do
            [ -f "$f" ] || continue
            # The spec reporter repeats every failure after "failing tests:", with its location and error.
            summary=$(sed -n '/failing tests:/,$p' "$f" | grep -vE '^\s+at ' | head -c 6000)
            summary=${summary//'%'/'%25'}; summary=${summary//$'\r'/}; summary=${summary//$'\n'/'%0A'}
            [ -n "$summary" ] && echo "::error title=Failing tests ($f, ${{ matrix.os }})::$summary"
          done
          true

  package:
    name: Package .vsix
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # vscode:prepublish type-checks and builds the production bundle.
      - run: npx vsce package --allow-missing-repository --skip-license -o infraon-code-assistant.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: infraon-code-assistant.vsix
          retention-days: 14

# Not run here:
#  - `npm run test:e2e` drives a real VS Code window (needs a desktop session).
#  - `npm run eval` calls the company LLM gateway, which is only reachable inside the network.
#  - Signing and publishing updates (scripts/sign-update.js, deploy.ps1) need the private signing key.
# Run these on a self-hosted runner inside the network; see CONTRIBUTING.md.
