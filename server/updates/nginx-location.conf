# Infraon Code Assistant self-update files, served by the same nginx that fronts the LLM gateway
# (https://172.16.48.75:30400). Add inside that server { } block, ABOVE the location that proxies to the LLM.
# Files: /srv/infraon-assistant/updates/latest.json and /srv/infraon-assistant/updates/*.vsix (written by deploy.ps1 -Publish).

location ^~ /infraon-assistant/updates/ {
    alias /srv/infraon-assistant/updates/;
    autoindex off;

    # Only these two kinds of file are served.
    location ~ \.vsix$ {
        types { } default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";   # versioned names never change
    }
    location ~ /latest\.json$ {
        types { } default_type application/json;
        add_header Cache-Control "no-cache";                              # clients must see a new release at once
    }
    location ~ . { return 404; }

    # Optional: accept only clients that hold a gateway API key. The extension sends
    # "Authorization: Bearer <key>" here because this is the gateway's own host. Integrity does not depend on this:
    # every package is checked against an ed25519-signed manifest.
    # if ($http_authorization !~ "^Bearer .+") { return 401; }
}

# Installer zips for first installs, linked from the Teams message:
#   /srv/infraon-assistant/downloads/InfraonCodeAssistant-Installer.zip
#   /srv/infraon-assistant/downloads/InfraonCodeAssistant-Mac-Installer.zip
location ^~ /infraon-assistant/downloads/ {
    alias /srv/infraon-assistant/downloads/;
    autoindex off;
    location ~ \.zip$ {
        types { } default_type application/zip;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";                              # same file name for every release
    }
    location ~ . { return 404; }
}
